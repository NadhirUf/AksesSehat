name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: AksesSehat-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Terbitkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AksesSehat (build terbaru)
          body: Build otomatis dari commit terakhir. Unduh app-release.apk lalu pasang di HP Android.
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
